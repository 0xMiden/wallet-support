name: Preview freshness

# Deploying the shared preview (help-center-shell) is a manual step, and PRs #7
# to #9 once sat merged for days while it still served PR #3. This checks that
# the link serves exactly what main builds, and keeps one issue open, assigned
# to the maintainer, for as long as it does not. No Cloudflare credentials: the
# link is public and serves its own deploy record.
#
# On every push to main, because that is when the link falls behind. Daily as
# well, as the reminder while it stays behind, and because GitHub disables a
# schedule in a quiet public repository after 60 days; the push trigger keeps
# working either way. On a pull request that changes the check, to test the
# check itself; that run reports in the pull request and never touches the issue.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *' # 09:00 in UTC+8
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/preview-freshness.yml
      - scripts/check-preview-freshness.mjs

permissions:
  contents: read

concurrency:
  group: preview-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds and compares. Runs the repository's code, so it gets read access only.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      # Actions are pinned to full commit SHAs, with the release tag beside each.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - name: Compare the link with this build
        id: check
        continue-on-error: true
        run: yarn -s check:preview-freshness --report "$RUNNER_TEMP/freshness.md"

      - name: Hand the result on
        id: result
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          report="$RUNNER_TEMP/freshness.md"
          if [ ! -s "$report" ]; then
            echo "The preview freshness check did not produce a result; the run log says why." > "$report"
          fi
          delimiter="REPORT_$(openssl rand -hex 16)"
          {
            echo "outcome=${OUTCOME:-failure}"
            echo "report<<$delimiter"
            cat "$report"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Fail the pull request's run while the link does not match
        if: github.event_name == 'pull_request' && steps.check.outcome != 'success'
        run: exit 1

  # Keeps one issue in step with the result. Holds the write token, so it runs
  # no repository code: no checkout, only the GitHub CLI and the check's report.
  issue:
    needs: check
    if: always() && github.event_name != 'pull_request' && needs.check.outputs.outcome != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: The shared preview link doesn't match main
      ASSIGNEE: Ivanlomoljo26
      OUTCOME: ${{ needs.check.outputs.outcome }}
      REPORT: ${{ needs.check.outputs.report }}
    steps:
      # Found by title among the bot's open issues: edited while the link stays
      # behind, closed once it catches up. Editing a body sends no notification,
      # so a stale link is announced once, when the issue opens, not every day.
      - name: Open, update or close the issue
        run: |
          printf '%s\n' "$REPORT" > "$RUNNER_TEMP/freshness.md"
          open=$(gh issue list --state open --author app/github-actions --limit 100 \
            --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          if [ "$OUTCOME" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The link matches main again, as of ${GITHUB_SHA::7}."
            fi
          elif [ -n "$open" ]; then
            gh issue edit "$open" --body-file "$RUNNER_TEMP/freshness.md"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/freshness.md" --assignee "$ASSIGNEE"
          fi

      - name: Fail the run while the link does not match
        if: env.OUTCOME != 'success'
        run: exit 1
