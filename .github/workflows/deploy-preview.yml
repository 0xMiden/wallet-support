name: Deploy support preview

# Inert until explicitly activated; deploys Pages only, never the production Worker.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: support-preview-help-center-shell
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ vars.SUPPORT_PREVIEW_AUTO_DEPLOY == 'true' &&
          github.repository == '0xMiden/wallet-support' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    environment: support-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Preview only. Never reuse this test key for the production Worker.
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a superseded main commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git rev-parse origin/main)" = "$TESTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      # Preserves clean-tree, remote-commit, lockfile, full Verify, preview-only,
      # asset-hash and security-header checks. No Worker/database deployment.
      - name: Deploy tested commit and check deployed assets and headers
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          yarn deploy:preview help-center-shell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Retain deployment and health-check result without a Git commit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: support-preview-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-deployment.jsonl
          if-no-files-found: warn
          retention-days: 30
